# Qwlee full stack: MongoDB + API/socket + marketplace web + admin.
#   cp .env.example .env   # then edit JWT_SECRET at minimum
#   docker compose up --build
# Seed demo data (optional):  docker compose run --rm backend npm run seed

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Not published to the host by default. Uncomment to connect a local client.
    # ports: ["27017:27017"]

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      mailpit:
        condition: service_started
    env_file: .env
    # Image uploads are stored here when IMGBB_API_KEY is not set.
    volumes:
      - uploads:/app/uploads
      # Read backup status; "Back up now" drops a trigger file here.
      - backups:/backups
    environment:
      NODE_ENV: production
      PORT: 7171
      SOCKET_PORT: 8181
      MONGODB_URL: mongodb://mongo:27017/qwlee
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-20}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8000,http://localhost:4000}
      # Email goes to the bundled Mailpit inbox unless you set real SMTP.
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      EMAIL_FROM: ${EMAIL_FROM:-Qwlee <no-reply@qwlee.local>}
      # Built-in demo checkout (no real money) when Stripe is not configured.
      # Turn off in production.
      DEMO_PAYMENTS: ${DEMO_PAYMENTS:-true}
      # Load the demo data when the API starts against an empty database
      # (fresh install or lost volume). Set to false in production.
      SEED_DEMO_IF_EMPTY: ${SEED_DEMO_IF_EMPTY:-true}
    ports:
      - "${BACKEND_PORT:-7171}:7171"
      - "${SOCKET_PORT:-8181}:8181"

  # Nightly MongoDB backups into the "backups" volume (scripts/backup.sh).
  # Status shows in Admin → Backups. Copy archives off the box for real
  # disaster recovery (see README → Backups).
  backup:
    image: mongo:7
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    entrypoint: ["sh", "/backup.sh"]
    volumes:
      - ./scripts/backup.sh:/backup.sh:ro
      - backups:/backups
      # Uploaded files are archived with each database backup.
      - uploads:/uploads:ro
      # Off-server copy: point BACKUP_OFFSITE_PATH at another disk, NFS
      # mount or synced folder. Defaults to ./offsite-backups on the host.
      - ${BACKUP_OFFSITE_PATH:-./offsite-backups}:/offsite
    environment:
      MONGODB_URL: mongodb://mongo:27017/qwlee
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}

  # Local email catcher: every email the app sends shows up at
  # http://localhost:8025. Point SMTP_* at a real server to send for real.
  mailpit:
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    ports:
      - "${MAILPIT_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8025/livez"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_BACKEND_API_URL: ${PUBLIC_API_URL:-http://localhost:7171}
        NEXT_PUBLIC_SOCKET_URL: ${PUBLIC_SOCKET_URL:-http://localhost:8181}
        NEXT_PUBLIC_SITE_NAME: ${SITE_NAME:-Qwlee}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      # Server-side calls (SEO settings) go straight to the backend.
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://backend:7171}
    ports:
      - "${FRONTEND_PORT:-8000}:8000"

  admin:
    build:
      context: ./admin
      args:
        VITE_API_BASE_URL: ${PUBLIC_API_URL:-http://localhost:7171}
        VITE_FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8000}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${ADMIN_PORT:-4000}:80"

volumes:
  uploads:
  mongo-data:
  backups:
