name: Docker build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [backend, frontend, admin]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.app }}
          push: false
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  compose:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Start stack
        run: |
          cp .env.example .env
          sed -i "s/^JWT_SECRET=.*/JWT_SECRET=$(openssl rand -hex 32)/" .env
          # The suite deliberately makes many failed sign-ins from one IP.
          echo "AUTH_RATE_LIMIT_MAX=500" >> .env
          docker compose up -d --build --wait --wait-timeout 300
      - name: Smoke test
        run: |
          curl -fsS http://localhost:7171/health
          curl -fsS -o /dev/null http://localhost:8000/
          curl -fsS -o /dev/null http://localhost:4000/
          curl -fsS -o /dev/null http://localhost:7171/seed/gig/i-will-build-a-modern-next-js-saas-website-with-authentication-and-stripe-0.jpg
      - name: Seed demo data
        run: docker compose exec -T backend npm run seed
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: API tests
        run: cd backend && npm ci --omit=dev --no-audit --no-fund && API_URL=http://localhost:7171 MAILPIT_URL=http://localhost:8025 npm test
      - name: Logs on failure
        if: failure()
        run: docker compose logs
